
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Admin panel to manage iamTrojan users"/>
  <title>iamtrojan.com | Admin Settings</title>

  <link rel="stylesheet" href="../assets/css/iamtrojan.css" />
  <link rel="stylesheet" href="../dexlibnn.css" />
  <link rel="stylesheet" href="../assets/Cssn/css/all.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="shortcut icon" href="../assets/images/Trojanlogo.png" type="image/png" sizes="80x80"/>

  <style>
    body {
      font-family: Arial;
      background: #0f0f0f;
      color: #fff;
      padding: 20px;
    }
    h2, h3 {
      color: #00f0ff;
    }
    .table-container {
      overflow-x: auto;
      width: 100%;
    }
    table {
      width: 100%;
      min-width: 600px;
      margin-top: 10px;
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #00f0ff;
      padding: 8px;
      text-align: center;
    }
    th {
      background: #00f0ff;
      color: #000;
    }
    .section {
      padding: 20px;
      max-width: 100%;
      margin: 30px auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
      border-radius: 6px;
      box-shadow: 0 0 10px #a00023;
    }
    input, select, textarea {
      padding: 10px;
      font-size: 14px;
      border-radius: 6px;
      border: 1px solid #00f0ff;
      background: #1a1f3c;
      color: #fff;
    }
    button {
      padding: 10px 20px;
      background: #00f0ff;
      color: black;
      font-weight: bold;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: aquamarine;
      color: #1a1f3c;
    }
  </style>
</head>
<body>

  <h2>🔐 Admin Settings Dashboard</h2>

  <div class="section">
    <h3>Reset a User's Password</h3>
    <input type="email" id="resetEmail" placeholder="example@user.com" />
    <input type="text" id="newPassword" placeholder="New password" />
    <button onclick="resetPassword()">Reset Password</button>
  </div>

  <div class="section">
    <h3>Change User Role</h3>
    <input type="email" id="roleEmail" placeholder="example@user.com" />
    <select id="newRole">
      <option value="user">User</option>
      <option value="admin">Admin</option>
      <option value="staff">Staff</option>
    </select>
    <button onclick="changeRole()">Change Role</button>
  </div>

  <div class="section">
    <h3>Send Announcement</h3>
    <textarea id="broadcastMessage" rows="5" placeholder="Write your announcement here..."></textarea>
    <button onclick="broadcast()">Send Message</button>
  </div>

  <div class="section" style="background:#0d1117;">
    <h3>User Management</h3>
    <input type="text" id="userSearch" placeholder="Search by name or email" onkeyup="filterUsers()" style="width:100%; padding:10px;"/>
    <select id="userSelect" style="width:100%; padding:10px;"></select>
    <input type="text" id="reason" placeholder="Reason for deletion" style="width:100%; padding:10px; margin-top:10px;"/>
    <button onclick="deleteUser()" style="background:red; color:white;">Delete User</button>
    <button onclick="restoreUser()" style="background:green; color:white;">Restore User</button>
    <p id="adminActionMsg" style="margin-top:15px;"></p>
  </div>

  <div class="section">
    <h3>All Registered Users</h3>
    <div class="table-container">
      <table>
        <thead>
          <tr><th>Name</th><th>Email</th><th>Role</th><th>Joined</th></tr>
        </thead>
        <tbody id="userTableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const token = localStorage.getItem("adminToken");
    if (!token) {
      alert("Access Denied: Admins only.");
      window.location.href = "iamtrojanlogin.html";
    }

    let allUsers = [];

    async function resetPassword() {
      const email = document.getElementById("resetEmail").value;
      const password = document.getElementById("newPassword").value;
      const res = await fetch("/admin/reset-password", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + token
        },
        body: JSON.stringify({ email, newPassword: password })
      });
      const result = await res.json();
      alert(result.message);
    }

    async function changeRole() {
      const email = document.getElementById("roleEmail").value;
      const role = document.getElementById("newRole").value;
      const res = await fetch("/admin/change-role", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + token
        },
        body: JSON.stringify({ email, role })
      });
      const result = await res.json();
      alert(result.message);
    }

    async function broadcast() {
      const message = document.getElementById("broadcastMessage").value;
      const res = await fetch("/admin/broadcast", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + token
        },
        body: JSON.stringify({ message })
      });
      const result = await res.json();
      alert(result.message);
    }

    async function loadUsers() {
      const res = await fetch("/all-users", {
        headers: { Authorization: "Bearer " + token }
      });
      allUsers = await res.json();
      populateUserDropdown(allUsers);
      populateUserTable(allUsers);
    }

    function populateUserDropdown(users) {
      const select = document.getElementById("userSelect");
      select.innerHTML = "";
      users.forEach(user => {
        const opt = document.createElement("option");
        opt.value = user.email;
        opt.text = `${user.name} (${user.email})${user.deletedAt ? " ⚠️" : ""}`;
        select.appendChild(opt);
      });
    }

    function populateUserTable(users) {
      const tbody = document.getElementById("userTableBody");
      tbody.innerHTML = "";
      users.forEach(user => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${user.name}</td>
          <td>${user.email}</td>
          <td>${user.role || "user"}</td>
          <td>${new Date(user.createdAt).toLocaleDateString()}</td>
        `;
        tbody.appendChild(row);
      });
    }

    function filterUsers() {
      const keyword = document.getElementById("userSearch").value.toLowerCase();
      const filtered = allUsers.filter(user =>
        user.name.toLowerCase().includes(keyword) ||
        user.email.toLowerCase().includes(keyword)
      );
      populateUserDropdown(filtered);
    }

    async function deleteUser() {
      const email = document.getElementById("userSelect").value;
      const reason = document.getElementById("reason").value;
      const res = await fetch("/admin/delete-user", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + token
        },
        body: JSON.stringify({ email, reason })
      });
      const result = await res.json();
      document.getElementById("adminActionMsg").innerText = result.message;
      loadUsers();
    }

    async function restoreUser() {
      const email = document.getElementById("userSelect").value;
      const res = await fetch("/admin/restore-user", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + token
        },
        body: JSON.stringify({ email })
      });
      const result = await res.json();
      document.getElementById("adminActionMsg").innerText = result.message;
      loadUsers();
    }

    loadUsers();
  </script>
</body>
</html>
